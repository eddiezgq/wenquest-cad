# 问渠 CAD 安装包（第 175 轮，测试版）：在 GitHub 的 Windows 机器上编 FreeCAD 1.1.4 + 29 个补丁 + AI 工作台，打成带安装向导的 Setup.exe。
# 一次编译超过单个任务 6 小时的上限，所以分几段接力：每段最多编 5 小时，没编完就把 build/release 存进缓存，下一段接着编（Ninja 增量）。
# 源码每段重新取，文件时间统一改成 2020-01-01（比缓存里的目标文件旧），Ninja 才不会把所有东西当成“改过了”重编。
name: WenQuest CAD installer
on:
  workflow_dispatch:
    inputs:
      ai_commit:
        description: "freecad-ai-parts 固定提交（同 ai-wqcad.ps1）"
        default: "51e62e358730e6e17607a31b58be6bbb91111808"
      version:
        description: "测试版版本号"
        default: "0.3.8-beta"
permissions:
  contents: write
  actions: read
concurrency:
  group: wqcad-installer
  cancel-in-progress: false
env:
  ROOT: D:\wqcad
  BUDGET_MIN: "290"
jobs:
  # 0.3.7（细则-0.3.7.md）：5 个 OCCT 补丁编进安装包。只编 TKMath、TKGeomAlgo、TKTopAlgo，按补丁内容存缓存，补丁不变以后直接取；
  # 和 FreeCAD 编译同时跑，编好放进本次运行的附件 occt-dlls，build 那段装好环境后取来换上。
  occt:
    name: occt
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }
      - name: 编过了？
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: D:\occt-out
          key: wqcad-occt-781-fc114-${{ hashFiles('kit/patches/occt-7.8.1/*.patch', 'kit/build-occt.ps1') }}
      - name: pixi
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          iwr -useb https://pixi.sh/install.ps1 | iex
          "$env:USERPROFILE\.pixi\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: 编 OCCT 7.8.1 + 5 个补丁（build-occt.ps1 -OutDir）
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Src = "$env:ROOT\FreeCAD"
          git -c core.autocrlf=false clone --quiet --branch 1.1.4 --depth 1 https://github.com/FreeCAD/FreeCAD.git $Src
          Set-Location $Src
          pixi config set --local run-post-link-scripts insecure
          pixi install
          if ($LASTEXITCODE -ne 0) { throw "pixi install" }
          & pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\kit\build-occt.ps1" -Root $env:ROOT -OutDir D:\occt-out
          $rc = $LASTEXITCODE
          Get-ChildItem "$env:GITHUB_WORKSPACE\kit\logs" -File -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 20 }
          if ($rc -ne 0) { throw "OCCT 编译失败" }
          foreach ($d in "TKMath.dll", "TKGeomAlgo.dll", "TKTopAlgo.dll") { if (-not (Test-Path "D:\occt-out\$d")) { throw "缺 $d" } }
      - name: 存起来（补丁不变以后不再编）
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\occt-out
          key: wqcad-occt-781-fc114-${{ hashFiles('kit/patches/occt-7.8.1/*.patch', 'kit/build-occt.ps1') }}
      - uses: actions/upload-artifact@v4
        with:
          name: occt-dlls
          path: D:\occt-out\*.dll
          retention-days: 7
  build:
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        leg: [1, 2, 3, 4]
    runs-on: windows-2022
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }
      - name: 已经编完、打好包了？（前面某一段做完就跳过）
        id: done
        uses: actions/cache/restore@v4
        with:
          path: kit/.done
          key: wqcad-done-${{ github.run_id }}
          lookup-only: true
      - name: pixi
        if: steps.done.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          iwr -useb https://pixi.sh/install.ps1 | iex
          "$env:USERPROFILE\.pixi\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: 取 FreeCAD 1.1.4、打补丁、源码时间统一
        if: steps.done.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Src = "$env:ROOT\FreeCAD"
          git -c core.autocrlf=false clone --quiet --branch 1.1.4 --depth 1 --recurse-submodules --shallow-submodules https://github.com/FreeCAD/FreeCAD.git $Src
          Set-Location $Src
          git config core.autocrlf false
          $n = 0
          foreach ($line in Get-Content "$env:GITHUB_WORKSPACE\kit\patches\series.txt" -Encoding UTF8) {
            $file = $line.Split("`t")[0]; if (-not $file) { continue }
            git apply --index --whitespace=nowarn "$env:GITHUB_WORKSPACE\kit\patches\$file"
            if ($LASTEXITCODE -ne 0) { throw "补丁打不上：$file" }
            $n++
          }
          "打上 $n 个补丁"
          $t = [datetime]'2020-01-01'
          Get-ChildItem -Recurse -File -Force -Path $Src -Exclude .git | Where-Object { $_.FullName -notmatch '\\\.git\\' } | ForEach-Object { $_.LastWriteTime = $t }
      - name: 取上一段的编译结果
        if: steps.done.outputs.cache-hit != 'true'
        id: prev
        uses: actions/cache/restore@v4
        with:
          path: D:\wqcad\FreeCAD\build\release
          key: wqcad-build-${{ github.run_id }}-${{ matrix.leg }}
          restore-keys: wqcad-build-${{ github.run_id }}-
      - name: 依赖（pixi 环境）与配置
        if: steps.done.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location "$env:ROOT\FreeCAD"
          pixi config set --local run-post-link-scripts insecure
          pixi install
          if ($LASTEXITCODE -ne 0) { throw "pixi install" }
          if (-not (Test-Path build\release\CMakeCache.txt)) {
            pixi run cmake --preset conda-windows-release "-DCMAKE_GENERATOR_PLATFORM=" "-DCMAKE_GENERATOR_TOOLSET=" "-DENABLE_DEVELOPER_TESTS=OFF"
            if ($LASTEXITCODE -ne 0) { throw "configure" }
          }
      - name: 编译（这一段最多 ${{ env.BUDGET_MIN }} 分钟）
        if: steps.done.outputs.cache-hit != 'true'
        id: build
        shell: pwsh
        run: |
          Set-Location "$env:ROOT\FreeCAD"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "4"
          $p = Start-Process -FilePath pixi -ArgumentList @("run", "cmake", "--build", "build/release") -NoNewWindow -PassThru -RedirectStandardOutput build-out.log -RedirectStandardError build-err.log
          $ok = $p.WaitForExit([int]$env:BUDGET_MIN * 60 * 1000)
          if (-not $ok) {
            "时间到，存起来下一段接着编"
            taskkill /T /F /PID $p.Id | Out-Null
            Start-Sleep 20
            Get-Content build-out.log -Tail 5
            "finished=false" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            exit 0
          }
          Get-Content build-out.log -Tail 15; Get-Content build-err.log -Tail 30
          if ($p.ExitCode -ne 0) { throw "编译出错（退出码 $($p.ExitCode)）" }
          "finished=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: 存这一段的编译结果
        if: steps.done.outputs.cache-hit != 'true' && steps.build.outputs.finished == 'false'
        uses: actions/cache/save@v4
        with:
          path: D:\wqcad\FreeCAD\build\release
          key: wqcad-build-${{ github.run_id }}-${{ matrix.leg }}
      - name: 安装进环境、装 AI 工作台、品牌
        if: steps.build.outputs.finished == 'true'
        shell: pwsh
        run: |
          $Src = "$env:ROOT\FreeCAD"; Set-Location $Src
          pixi run cmake --install build/release
          if ($LASTEXITCODE -ne 0) { throw "install" }
          $Env = "$Src\.pixi\envs\default"
          Copy-Item "$env:GITHUB_WORKSPACE\kit\branding.xml" "$Env\Library\bin\branding.xml" -Force
          $Repo = "$env:ROOT\freecad-ai-parts"
          git clone --quiet https://github.com/eddiezgq/freecad-ai-parts.git $Repo
          git -C $Repo -c advice.detachedHead=false checkout --quiet "${{ inputs.ai_commit }}"
          $env:PYTHONUTF8 = "1"
          & "$Env\python.exe" -c "import sys,tomllib;p=tomllib.load(open(sys.argv[1],'rb'))['project'];r=list(p['dependencies'])+[x for g in ('llm','fea','mbd','report') for x in p['optional-dependencies'][g]];open(sys.argv[2],'w').write('\n'.join(x.split('#')[0].strip() for x in r if x.strip()))" "$Repo\pyproject.toml" req.txt
          pixi run python -m pip install --disable-pip-version-check --no-warn-script-location -r req.txt
          if ($LASTEXITCODE -ne 0) { throw "pip" }
          $env:PYTHONPATH = $Repo
          pixi run python -m freecad_addon.install --standalone --mod-dir "$Env/Library/Mod"
          if (-not (Test-Path "$Env\Library\Mod\FreeCADAIParts\InitGui.py")) { throw "AI 工作台没装上" }
          Remove-Item Env:\PYTHONPATH
          # 第 175 轮：测试版一年授权（授权码由问渠学习平台发，wq_license 内置美国、国内两把公钥）；AI 工作台的程序只放字节码
          $M = "$Env\Library\Mod\FreeCADAIParts"
          Copy-Item "$env:GITHUB_WORKSPACE\kit\installer\wq_license.py", "$env:GITHUB_WORKSPACE\kit\installer\wq_gate.py" "$M\lib\"
          $ig = Get-Content "$M\InitGui.py" -Raw -Encoding UTF8
          $ig2 = [regex]::Replace($ig, '(?m)^register\(\)\s*$', "import wq_gate`nif wq_gate.licensed('AI Parts'):`n    register()`n")
          if ($ig2 -eq $ig) { throw "InitGui 里找不到 register()" }
          [IO.File]::WriteAllText("$M\InitGui.py", $ig2, (New-Object Text.UTF8Encoding $false))
          if (Test-Path "$M\lib\tests") { Remove-Item -Recurse -Force "$M\lib\tests" }
          & "$Env\python.exe" -m compileall -q -b -j 0 "$M\lib"
          if ($LASTEXITCODE -ne 0) { throw "compileall" }
          Get-ChildItem -Recurse "$M\lib" -Filter *.py | Remove-Item -Force
          Get-ChildItem -Recurse -Directory "$M\lib" -Filter __pycache__ | Remove-Item -Recurse -Force
          & "$Env\python.exe" -c "import sys; sys.path.insert(0, r'$M\lib'); import wq_license, freecad_addon; print('GATE-OK', bool(wq_license.KEYS['us']), bool(wq_license.KEYS['cn']))"
          if ($LASTEXITCODE -ne 0) { throw "AI 工作台字节码导入失败" }
          # 11-23（细则-帮助与培训 第十三节第 2 件）：“帮助与培训”打开的课程网页本机副本（课文、小测、动画离线；录屏在线取）
          & "$Env\python.exe" "$env:GITHUB_WORKSPACE\kit\tools\help_offline.py" "$M\help"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$M\help\wqcad\en\index.html")) { throw "课程网页副本没做好" }
          "ccx:$(Test-Path "$Env\Library\bin\ccx.exe")"
      - name: 换上打过补丁的 OCCT（0.3.7），换前换后各跑一次 TestPartApp
        if: steps.build.outputs.finished == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Src = "$env:ROOT\FreeCAD"; Set-Location $Src
          $Env = "$Src\.pixi\envs\default"
          if (-not (Get-ChildItem "$Env\conda-meta" -Filter "occt-7.8.1-*.json")) { throw "环境里的 OCCT 不是 7.8.1，补丁对不上" }
          # 等 occt 那个任务（一般早就完了）
          for ($i = 0; $i -lt 90; $i++) {
            $st = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=50" --jq '.jobs[] | select(.name == "occt") | .status + " " + (.conclusion // "")'
            if ($st -like "completed*") { break }
            Start-Sleep 60
          }
          if ($st -ne "completed success") { throw "OCCT 任务没成功：$st" }
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} -n occt-dlls -D D:\occt-in
          if ($LASTEXITCODE -ne 0) { throw "取不到 OCCT 程序库" }
          function PartTests($tag) {
            $o = pixi run .pixi/envs/default/Library/bin/FreeCADCmd.exe -t TestPartApp 2>&1 | Out-String
            $ran = [regex]::Match($o, 'Ran (\d+) tests?')
            if (-not $ran.Success) { $o.Split("`n") | Select-Object -Last 30 | ForEach-Object { Write-Host $_ }; throw "TestPartApp（$tag）没跑起来" }
            $f = @([regex]::Matches($o, '(?m)^(?:FAIL|ERROR): (\S+) \(([^)]+)\)') | ForEach-Object { "$($_.Groups[2].Value).$($_.Groups[1].Value)" } | Sort-Object -Unique)
            Write-Host "TestPartApp（$tag）：运行 $($ran.Groups[1].Value)，失败或出错 $($f.Count)"; $f | ForEach-Object { Write-Host "  $_" }
            return ,$f
          }
          $before = PartTests "换库前"
          foreach ($d in "TKMath.dll", "TKGeomAlgo.dll", "TKTopAlgo.dll") {
            if (-not (Test-Path "D:\occt-in\$d")) { throw "缺 $d" }
            Copy-Item "D:\occt-in\$d" "$Env\Library\bin\$d" -Force
            "已换上 $d"
          }
          $after = PartTests "换库后"
          $new = @($after | Where-Object { $before -notcontains $_ })
          if ($new.Count) { throw ("换库后 TestPartApp 多出失败：" + ($new -join "、")) }
          "换库后没有多出失败"
          $global:LASTEXITCODE = 0   # TestPartApp 原有的失败会让最后一次 FreeCADCmd 退出码非 0，比较已在上面做完
      - name: 冒烟测试（无界面打开、测试脚本）
        if: steps.build.outputs.finished == 'true'
        shell: pwsh
        run: |
          $Src = "$env:ROOT\FreeCAD"; Set-Location $Src
          pixi run .pixi/envs/default/Library/bin/FreeCADCmd.exe -c "import FreeCAD,Part;print('WQCAD-OK', FreeCAD.Version()[:3], Part.makeBox(1,2,3).Volume)"
          # 0.3.6 细则 A1：书里 16 组回归测试逐组真跑（原来没设 WQCAD_TEST_FILE，脚本一启动就出错，被吞掉，等于没测）。
          # 有失败或出错就不出包；每组运行的个数要等于文件里 test 方法的个数，少了说明没跑全。0.3.7 起 OCCT 补丁已换上，没有例外。
          $runs = 0; $bad = @()
          foreach ($f in Get-ChildItem "$env:GITHUB_WORKSPACE\kit\tests" -Filter *.py) {
            $env:WQCAD_TEST_FILE = $f.FullName
            $env:WQCAD_OUT = "$env:RUNNER_TEMP\book-$($f.BaseName).json"
            Remove-Item $env:WQCAD_OUT -ErrorAction SilentlyContinue
            pixi run .pixi/envs/default/Library/bin/FreeCADCmd.exe "$env:GITHUB_WORKSPACE/kit/run_book_tests.py" 2>&1 | Out-Null
            if (-not (Test-Path $env:WQCAD_OUT)) { $bad += "$($f.BaseName)：没有结果"; continue }
            $r = Get-Content $env:WQCAD_OUT -Raw | ConvertFrom-Json
            $runs += $r.run
            $want = (Select-String -Path $f.FullName -Pattern '^    def test').Count
            if ($r.run -ne $want) { $bad += "$($f.BaseName)：运行 $($r.run) 个，文件里有 $want 个" }
            "本书测试 $($f.BaseName)：运行 $($r.run)，失败 $($r.failures)，出错 $($r.errors)，跳过 $($r.skipped)"
            if (($r.failures + $r.errors) -gt 0) { $bad += "$($f.BaseName)：失败 $($r.failures)、出错 $($r.errors)" }
          }
          "本书测试合计运行 $runs 个"
          if ($runs -lt 61) { $bad += "合计只运行了 $runs 个（16 组共 61 个）" }
          if ($bad) { throw ("本书回归测试没过：" + ($bad -join "；")) }
          # 11-20：装配体多体动力学（FreeCAD 1.1 兼容）、出报告（python-docx）、MuJoCo 在装好的环境里真能用
          $env:WQCAD_AI_LIB = "$Src\.pixi\envs\default\Library\Mod\FreeCADAIParts\lib"
          $env:WQCAD_OUT = "$env:RUNNER_TEMP\ai-e2e.json"
          $e2e = pixi run .pixi/envs/default/Library/bin/FreeCADCmd.exe "$env:GITHUB_WORKSPACE/kit/run_ai_e2e.py" 2>&1 | Out-String
          $e2e.Split("`n") | Select-Object -Last 25
          # 11-22：结论看它写的 JSON（FreeCADCmd 跑脚本时 print 不一定进标准输出，0.3.1 第一次出包就因此误判）
          $res = if (Test-Path $env:WQCAD_OUT) { Get-Content $env:WQCAD_OUT -Raw | ConvertFrom-Json } else { $null }
          if (-not $res -or -not $res.ok) { Get-Content $env:WQCAD_OUT -ErrorAction SilentlyContinue; throw "AI 工作台端到端检查没过" }
          "AI 端到端：ok"
      - name: 瘦身、写启动器、打安装包
        if: steps.build.outputs.finished == 'true'
        shell: pwsh
        run: |
          $Env = "$env:ROOT\FreeCAD\.pixi\envs\default"
          foreach ($d in @("Library\include", "pkgs", "Library\share\doc", "Library\lib\cmake")) { if (Test-Path "$Env\$d") { Remove-Item -Recurse -Force "$Env\$d" } }
          Get-ChildItem -Recurse "$Env\Library\lib" -Filter *.lib | Remove-Item -Force
          Get-ChildItem -Recurse -File $Env -Include *.pdb | Remove-Item -Force          # 调试符号用户用不上
          Get-ChildItem -Recurse -Directory $Env -Filter __pycache__ | Remove-Item -Recurse -Force
          "环境大小 $([math]::Round((Get-ChildItem -Recurse -File $Env | Measure-Object Length -Sum).Sum / 1GB, 2)) GB"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\kit\installer\*" out\
          cmd /c mklink /J out\env "$Env" | Out-Null                       # 用安装包里的启动器、不经 pixi 跑一次，确认环境设对了
          cmd /c "out\WenQuestCAD.cmd --cmd -c ""import FreeCAD,Part;print('LAUNCHER-OK', Part.makeBox(1,2,3).Volume)""" 2>&1 | Select-Object -Last 5
          cmd /c rmdir out\env
          & pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\kit\installer\relocate.ps1" -Env $Env    # 11-22：qt6.conf 改相对路径
          if ($LASTEXITCODE -ne 0) { throw "relocate" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DEnvDir=$Env" "/DAppVersion=${{ inputs.version }}" "/Oout" out\wqcad.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup" }
          # 11-22：装到别处、把打包机上的环境藏起来，真把界面打开
          & pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\kit\installer\gui-check.ps1" -Setup (Get-ChildItem out\*.exe | Select-Object -First 1).FullName -Dir "C:\wq-gui-check" -Hide "$env:ROOT\FreeCAD\.pixi" -SoftGL
          if ($LASTEXITCODE -ne 0) { throw "装好后界面打不开" }
          Get-ChildItem out\*.exe | ForEach-Object { "$($_.Name) $([math]::Round($_.Length/1MB)) MB"; (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256" -Encoding ascii }
          New-Item -ItemType File -Force "$env:GITHUB_WORKSPACE\kit\.done" | Out-Null
      - name: 记“做完了”（后面的段跳过）
        if: steps.build.outputs.finished == 'true'
        uses: actions/cache/save@v4
        with:
          path: kit/.done
          key: wqcad-done-${{ github.run_id }}
      - name: 上传安装包
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wqcad-setup
          path: out/*.exe*
          retention-days: 30
          compression-level: 0
      - name: 发到 GitHub 发布版（测试版）
        if: steps.build.outputs.finished == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          gh release create $tag --repo ${{ github.repository }} --prerelease --title "问渠 CAD ${{ inputs.version }}（测试版）" --notes "测试版：FreeCAD 1.1.4 + 29 个补丁 + AI 工作台（freecad-ai-parts ${{ inputs.ai_commit }}）。0.3.6 按三本书的发现修了有限元、多体动力学的 8 处错误；0.3.7 把书里 5 个 OCCT 补丁编进安装包（OCCT 7.8.1，源码说明见安装目录 OCCT-patches.txt）；0.3.8 修了多体动力学 14 处「结果错了却报正常」的问题（摩擦自锁、过死点、短脉冲、高速转动、初速度、PID 抗饱和、线性化不计控制器、接触恢复系数、带传动打滑等）；书里 16 组 61 个回归测试全过才出包。安装教程见问渠官网下载页。" (Get-ChildItem out\*.exe, out\*.sha256 | ForEach-Object FullName)
