# 装好以后真把界面打开（11-22 Eddie：问渠有限元装好后报 “no Qt platform plugin could be initialized”）。
# 从本仓库 GitHub 发布版取安装包，静默安装，启动 FreeCAD.exe 跑一个小宏（写一个文件就退出）；
# 打不开就把 Qt 插件目录、qt.conf、环境变量列出来。手动运行。
name: GUI start check
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布版标签（fea-v0.0.1-beta / mbd-v0.0.1-beta / v0.3.0-beta）
        default: fea-v0.0.1-beta
      dir:
        description: 装到哪里（空 = 安装包默认目录）
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: 取安装包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "*.exe" --dir pkg && ls -l pkg
      - uses: actions/checkout@v4
        with:
          path: kit
      - name: 安装、真把界面打开
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem pkg -Filter *.exe | Select-Object -First 1).FullName
          $a = @{ Setup = $setup; SoftGL = $true }
          if ("${{ inputs.dir }}") { $a.Dir = "${{ inputs.dir }}" }
          & kit\installer\gui-check.ps1 @a
      - name: 打不开时的截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-fail
          path: ${{ runner.temp }}/gui-fail.png
          if-no-files-found: ignore
